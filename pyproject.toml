[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-band"
version = "0.1.0"
description = "Compose and render original music locally. No music API, no model, no per-track cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Regeneratus Labs" }]
keywords = ["music", "midi", "soundfont", "fluidsynth", "composition", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hermes-band = "band.cli:main"

[project.urls]
Homepage = "https://github.com/RegeneratusLabs/hermes-band"

[tool.setuptools.packages.find]
include = ["band*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
